<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{designSystemUri}}" />
  <link rel="stylesheet" href="{{katexStyleUri}}" />
  <link rel="stylesheet" href="{{hljsStyleUri}}" />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>📖 讲义阅读器</title>
</head>
<body>
  <header class="lecture-header">
    <div class="lecture-actions lecture-actions-left">
      <button class="btn-mini btn-mini--icon" id="btnRevert" type="button" title="撤回上一次写入（恢复 .bak 备份，Ctrl+Z 不好使时用这个）" aria-label="撤回上一次写入">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7v6h6" />
          <path d="M21 17a9 9 0 0 0-15-6.7L3 13" />
        </svg>
      </button>
    </div>
    <div class="lecture-meta">
      <div class="lecture-topic" id="lectureTopic"></div>
      <h1 class="lecture-title" id="lectureTitle">加载中…</h1>
    </div>
    <div class="lecture-actions">
      <span class="lecture-status" id="lectureStatus"></span>
      <button class="btn-mini" id="btnReload" title="重新加载">↻</button>
    </div>
  </header>
  <main id="lectureBody" class="lecture-body markdown-body"></main>

  <button id="chip" class="lecture-chip" type="button" title="问 AI / 改写选区（无选区时基于全文）" aria-label="问 AI">💬</button>
  <div id="popover" class="lecture-comment-popover" hidden></div>
  <div id="toastContainer" class="lecture-toast-container"></div>

  <script src="{{markdownItUri}}"></script>
  <script src="{{katexScriptUri}}"></script>
  <script src="{{katexAutoRenderUri}}"></script>
  <script src="{{hljsScriptUri}}"></script>
  <script src="{{mermaidScriptUri}}"></script>
  <script src="{{graphvizScriptUri}}"></script>
  <script src="{{renderHelpersUri}}"></script>
  <script src="{{scriptUri}}"></script>
</body>
</html>
